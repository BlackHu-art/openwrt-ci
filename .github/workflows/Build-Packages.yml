name: Build-Packages

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 可选：OpenWrt SDK 版本，ALL 表示全部版本，main 使用主线 snapshots，稳定版自动使用对应系列最新版本。
        required: false
        default: '25.12'
        type: choice
        options:
          - ALL
          - main
          - '25.12'
          - '24.10'
          - '23.05'
      arch:
        description: 可选：要编译的架构，ALL 表示全部。
        required: false
        default: ALL
        type: choice
        options:
          - ALL
          - x86-64
          - aarch64
      package:
        description: 可选：要编译的软件包，ALL 表示全部。
        required: false
        default: ALL
        type: choice
        options:
          - ALL
          - nginx
          - luci-app-frpc
          - luci-app-frps
          - luci-app-gecoosac
          - luci-app-lucky
          - luci-app-openlist2
          - luci-theme-argon
          - luci-theme-aurora
      enable_cache:
        description: 可选：启用编译缓存（默认开启）。
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      sdk_version:
        required: false
        default: ALL
        type: string
      arch:
        required: false
        default: ALL
        type: string
      package:
        required: false
        default: ALL
        type: string
      enable_cache:
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Shanghai
  OUTPUT_DIR: ${{ github.workspace }}/artifacts/packages

jobs:
  Prepare:
    name: Prepare Matrix(准备编译矩阵)
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - name: Generate Build Matrix(生成编译矩阵)
      id: matrix
      env:
        SELECTED_ARCH: ${{ inputs.arch }}
        SELECTED_PACKAGE: ${{ inputs.package }}
        SELECTED_SDK_VERSION: ${{ inputs.sdk_version }}
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        import os

        selected_arch = os.environ["SELECTED_ARCH"]
        selected_package = os.environ["SELECTED_PACKAGE"].lower()
        selected_sdk_version = os.environ["SELECTED_SDK_VERSION"]

        sdk_versions = ["main", "25.12", "24.10", "23.05"]
        architectures = ["x86-64", "aarch64"]

        if selected_sdk_version == "ALL":
            selected_sdk_versions = sdk_versions
        elif selected_sdk_version in sdk_versions:
            selected_sdk_versions = [selected_sdk_version]
        else:
            raise SystemExit(f"Unsupported sdk_version: {selected_sdk_version}")

        if selected_arch == "ALL" and selected_package in {"luci-theme-argon", "luci-theme-aurora"}:
            selected_architectures = ["x86-64"]
        elif selected_arch == "ALL":
            selected_architectures = architectures
        elif selected_arch in architectures:
            selected_architectures = [selected_arch]
        else:
            raise SystemExit(f"Unsupported arch: {selected_arch}")

        def build_for(sdk_version, architecture):
            if architecture == "x86-64":
                return {
                    "sdk_version": sdk_version,
                    "name": "x86-64",
                    "openwrt_target": "x86",
                    "openwrt_subtarget": "64",
                    "openwrt_target_profile": "",
                    "config_files": "configs/x86-64.config configs/Packages.config",
                }

            if sdk_version in {"23.05", "24.10"}:
                return {
                    "sdk_version": sdk_version,
                    "name": "aarch64",
                    "openwrt_target": "mediatek",
                    "openwrt_subtarget": "filogic",
                    "openwrt_target_profile": "rax3000m",
                    "config_files": "configs/Packages.config",
                }

            return {
                "sdk_version": sdk_version,
                "name": "aarch64",
                "openwrt_target": "qualcommax",
                "openwrt_subtarget": "ipq60xx",
                "openwrt_target_profile": "",
                "config_files": "configs/JDCloud.config configs/Packages.config",
            }

        include = [
            build_for(sdk_version, architecture)
            for sdk_version in selected_sdk_versions
            for architecture in selected_architectures
        ]

        print(f"matrix={json.dumps({'include': include}, separators=(',', ':'))}")
        PY

  Build:
    name: Build (${{ matrix.sdk_version }} / ${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: Prepare
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Prepare.outputs.matrix) }}
    steps:
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(grep "physical id" /proc/cpuinfo | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(grep name /proc/cpuinfo | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        free -h
        echo "--------------------------硬盘信息--------------------------"
        df -hT

    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install \
          build-essential \
          clang \
          curl \
          file \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          gnupg \
          git \
          libelf-dev \
          libfuse-dev \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-setuptools \
          rsync \
          tar \
          unzip \
          wget \
          xz-utils \
          zip \
          zlib1g-dev \
          zstd
        sudo timedatectl set-timezone "$TZ"

    - name: Checkout(检出代码)
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Resolve And Verify SDK Metadata(解析并验证SDK元数据)
      id: sdk
      env:
        OPENWRT_TARGET: ${{ matrix.openwrt_target }}
        OPENWRT_SUBTARGET: ${{ matrix.openwrt_subtarget }}
        OPENWRT_SDK_VERSION: ${{ matrix.sdk_version }}
        CACHE_CONFIG_HASH: ${{ hashFiles('configs/*.config', 'scripts/SDK-script.sh') }}
        SDK_CACHE_DIR: ${{ runner.temp }}/openwrt-sdk-cache
        SDK_METADATA_REFRESH: ${{ matrix.sdk_version == 'main' && 'true' || 'false' }}
        SDK_METADATA_ONLY: '1'
      run: |
        chmod +x scripts/SDK-script.sh
        scripts/SDK-script.sh
        echo "config_hash=${CACHE_CONFIG_HASH:0:7}" >> "$GITHUB_OUTPUT"

    - name: Restore SDK Ccache(恢复SDK编译缓存)
      if: ${{ inputs.enable_cache }}
      id: ccache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/openwrt-sdk/.ccache
        key: openwrt-ccache-${{ runner.os }}-${{ matrix.sdk_version }}-${{ matrix.openwrt_target }}-${{ matrix.openwrt_subtarget }}-${{ steps.sdk.outputs.sha256_short }}-${{ inputs.package }}-${{ steps.sdk.outputs.config_hash }}
        restore-keys: |
          openwrt-ccache-${{ runner.os }}-${{ matrix.sdk_version }}-${{ matrix.openwrt_target }}-${{ matrix.openwrt_subtarget }}-${{ steps.sdk.outputs.sha256_short }}-

    - name: Build Packages With OpenWrt SDK(使用OpenWrt SDK编译软件包)
      id: build
      env:
        OPENWRT_TARGET: ${{ matrix.openwrt_target }}
        OPENWRT_SUBTARGET: ${{ matrix.openwrt_subtarget }}
        OPENWRT_TARGET_PROFILE: ${{ matrix.openwrt_target_profile }}
        PACKAGE_CONFIG_FILES: ${{ matrix.config_files }}
        PACKAGE_ARCH_NAME: ${{ matrix.name }}
        PACKAGE_SELECTED_ARCH: ${{ inputs.arch }}
        PACKAGE_SELECTION: ${{ inputs.package }}
        OPENWRT_SDK_VERSION: ${{ matrix.sdk_version }}
        SDK_CACHE_DIR: ${{ runner.temp }}/openwrt-sdk-cache
        SDK_METADATA_REFRESH: ${{ matrix.sdk_version == 'main' && 'true' || 'false' }}
        SDK_ROOT: ${{ runner.temp }}/openwrt-sdk
        SDK_SHA256: ${{ steps.sdk.outputs.sha256 }}
        SDK_URL: ${{ steps.sdk.outputs.url }}
      run: |
        chmod +x scripts/SDK-script.sh
        scripts/SDK-script.sh

    - name: Save SDK Ccache(保存SDK编译缓存)
      if: ${{ inputs.enable_cache && !cancelled() && steps.build.outputs.sha256 != '' && (steps.ccache.outputs.cache-hit != 'true' || steps.build.outputs.sha256 != steps.sdk.outputs.sha256) }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/openwrt-sdk/.ccache
        key: openwrt-ccache-${{ runner.os }}-${{ matrix.sdk_version }}-${{ matrix.openwrt_target }}-${{ matrix.openwrt_subtarget }}-${{ steps.build.outputs.sha256_short }}-${{ inputs.package }}-${{ steps.sdk.outputs.config_hash }}

    - name: Upload Packages Artifact(上传软件包产物)
      if: ${{ always() && !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.sdk_version }}-Packages-${{ matrix.name }}
        path: artifacts/packages/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

  Release:
    runs-on: ubuntu-24.04
    needs: Build
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: write
      actions: read

    steps:
    - name: Download Packages Artifacts(下载软件包产物)
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.sdk_version == 'ALL' && '*-Packages-*' || format('{0}-Packages-*', inputs.sdk_version) }}
        path: artifacts/release
        merge-multiple: true

    - name: Check Downloaded Packages(检查已下载的软件包)
      id: packages
      run: |
        mkdir -p artifacts/release
        if find artifacts/release -type f -name '*.zip' -print -quit | grep -q .; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "::warning::没有可发布的成功编译产物，跳过 Release 上传。"
        fi

    - name: Prepare Release Body
      if: ${{ steps.packages.outputs.found == 'true' }}
      run: |
        cat > release_body.txt <<EOF
        **OpenWrt Packages**
          - SDK Version: ${{ inputs.sdk_version }}
          - Architecture: ${{ inputs.arch }}
          - Package: ${{ inputs.package }}

        Download the matching archive, extract it, then install packages with:
        \`\`\`
        apk add --allow-untrusted *.apk
        opkg install *.ipk
        \`\`\`
        EOF

    - name: Upload Packages To Release(发布软件包)
      if: ${{ steps.packages.outputs.found == 'true' }}
      uses: ncipollo/release-action@v1
      with:
        name: Packages
        allowUpdates: true
        replacesArtifacts: true
        artifactErrorsFailBuild: true
        tag: Packages
        token: ${{ github.token }}
        artifacts: artifacts/release/*
        bodyFile: release_body.txt
